name: CI
"on":
  push: { branches: [main] }
  pull_request: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read }

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          # sqlite3 + pdo_sqlite: the tests run the plugin's own migration on
          # SQLite. intl: slug transliteration (see PostSlug::normalise()).
          extensions: json, intl, mbstring, ctype, tokenizer, filter, openssl, curl, fileinfo, sqlite3, pdo_sqlite
          tools: composer
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict --no-check-publish

      - name: Install dependencies
        run: composer update --no-interaction --no-progress --prefer-dist

      - name: PHPUnit
        run: vendor/bin/phpunit --no-coverage
